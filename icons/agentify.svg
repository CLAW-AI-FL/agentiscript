<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Agent node with network connections expanding outward -->
  
  <!-- Outer ring nodes (satellite agents) -->
  <circle cx="50" cy="12" r="5" fill="none" stroke="#C0C0C0" stroke-width="2"/>
  <circle cx="83" cy="30" r="5" fill="none" stroke="#C0C0C0" stroke-width="2"/>
  <circle cx="83" cy="70" r="5" fill="none" stroke="#C0C0C0" stroke-width="2"/>
  <circle cx="50" cy="88" r="5" fill="none" stroke="#C0C0C0" stroke-width="2"/>
  <circle cx="17" cy="70" r="5" fill="none" stroke="#C0C0C0" stroke-width="2"/>
  <circle cx="17" cy="30" r="5" fill="none" stroke="#C0C0C0" stroke-width="2"/>
  
  <!-- Connection lines from center to outer nodes -->
  <line x1="50" y1="50" x2="50" y2="17" stroke="#C0C0C0" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.7"/>
  <line x1="50" y1="50" x2="79" y2="33" stroke="#C0C0C0" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.7"/>
  <line x1="50" y1="50" x2="79" y2="67" stroke="#C0C0C0" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.7"/>
  <line x1="50" y1="50" x2="50" y2="83" stroke="#C0C0C0" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.7"/>
  <line x1="50" y1="50" x2="21" y2="67" stroke="#C0C0C0" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.7"/>
  <line x1="50" y1="50" x2="21" y2="33" stroke="#C0C0C0" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.7"/>
  
  <!-- Mid-level ring connections (hexagonal mesh) -->
  <line x1="50" y1="17" x2="79" y2="33" stroke="#C0C0C0" stroke-width="1" opacity="0.3"/>
  <line x1="79" y1="33" x2="79" y2="67" stroke="#C0C0C0" stroke-width="1" opacity="0.3"/>
  <line x1="79" y1="67" x2="50" y2="83" stroke="#C0C0C0" stroke-width="1" opacity="0.3"/>
  <line x1="50" y1="83" x2="21" y2="67" stroke="#C0C0C0" stroke-width="1" opacity="0.3"/>
  <line x1="21" y1="67" x2="21" y2="33" stroke="#C0C0C0" stroke-width="1" opacity="0.3"/>
  <line x1="21" y1="33" x2="50" y2="17" stroke="#C0C0C0" stroke-width="1" opacity="0.3"/>
  
  <!-- Central agent node - double circle for emphasis -->
  <circle cx="50" cy="50" r="16" fill="none" stroke="#C4A35A" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="10" fill="#C4A35A" opacity="0.2"/>
  <circle cx="50" cy="50" r="5" fill="#C4A35A"/>
  
  <!-- Small gold fill dots for outer nodes to show activity -->
  <circle cx="50" cy="12" r="2.5" fill="#C4A35A" opacity="0.8"/>
  <circle cx="83" cy="30" r="2.5" fill="#C4A35A" opacity="0.6"/>
  <circle cx="83" cy="70" r="2.5" fill="#C4A35A" opacity="0.5"/>
  <circle cx="50" cy="88" r="2.5" fill="#C4A35A" opacity="0.7"/>
  <circle cx="17" cy="70" r="2.5" fill="#C4A35A" opacity="0.5"/>
  <circle cx="17" cy="30" r="2.5" fill="#C4A35A" opacity="0.6"/>
</svg>
